[project]
name = "rekordbox-collection-manager"
version = "0.1.0"
description = "Rekordbox Collection Manager - Native desktop application and utilities to manage, inspect, and fix Rekordbox collections"
readme = "README.md"
authors = [
    { name = "Fabrizio", email = "mail@fabriziocacicia.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyrekordbox>=0.4.4",
    "pyside6>=6.5.0",
    "questionary>=2.1.1",
]

[project.scripts]
rekordbox-manager = "rekordbox_collection_fixer.gui.app:main"
rekordbox-gui = "rekordbox_collection_fixer.gui.app:main"
rename-history = "rekordbox_collection_fixer.rename_history:main"
edit-play-count = "rekordbox_collection_fixer.edit_play_count:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rekordbox_collection_fixer"
module-root = "src"
